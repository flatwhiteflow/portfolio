<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc">
<title id="title">From conversation to a useful note, on this Mac</title><desc id="desc">An editorial diagram of two audio tracks moving into a locally written meeting note, in Scribby's warm linen and umber palette.</desc>
<defs>
 <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#ece1d4"/><stop offset="1" stop-color="#cbb8a8"/></linearGradient>
 <linearGradient id="track" x2="1"><stop stop-color="#a88978"/><stop offset="1" stop-color="#5a3d35"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#3a2921" flood-opacity=".19"/></filter>
 <pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".35" fill="#4a352b" opacity=".13"/></pattern>
</defs>
<rect width="1600" height="850" fill="url(#paper)"/><rect width="1600" height="850" fill="url(#grain)"/>
