function buttons(target,labels,handler){const group=document.getElementById(target);labels.forEach(([label,value],i)=>{const b=document.createElement('button');b.textContent=label;b.type='button';b.setAttribute('aria-pressed',i===0?'true':'false');b.addEventListener('click',()=>{handler(value);[...group.children].forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()});group.appendChild(b)})}
buttons('views',[['Three-quarter',14],['Front',0],['Side',90],['Back',180],['Turntable','spin']],value=>{if(value==='spin'){turntable=true}else{turntable=false;CAM.az=value}L.allowTurn=false});
buttons('expressions',[['Idle','idle'],['Listening','listening'],['Thinking','thinking'],['Done','done'],['Oops','error']],value=>L.set(value));
hero.addEventListener('pointerdown',e=>{dragging=true;turntable=false;L.allowTurn=false;lastX=e.clientX;lastY=e.clientY;hero.setPointerCapture(e.pointerId)});
hero.addEventListener('pointermove',e=>{if(!dragging)return;CAM.az+=(e.clientX-lastX)*.55;CAM.el=Math.max(-22,Math.min(38,CAM.el-(e.clientY-lastY)*.35));lastX=e.clientX;lastY=e.clientY;render()});
hero.addEventListener('pointerup',()=>dragging=false);hero.addEventListener('pointercancel',()=>dragging=false);
hero.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();if(e.key==='ArrowLeft')CAM.az-=12;if(e.key==='ArrowRight')CAM.az+=12;if(e.key==='ArrowUp')CAM.el=Math.min(38,CAM.el+8);if(e.key==='ArrowDown')CAM.el=Math.max(-22,CAM.el-8);render()});
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data&&e.data.type==='jot-visibility')visible=!!e.data.visible});
function loop(now){const dt=last?Math.min(.05,(now-last)/1000):1/60;last=now;if(visible&&!reduced&&!dragging){if(turntable)CAM.az+=dt*14;draw(L.step(dt),440,false,0);ctx.clearRect(0,0,440,440);ctx.drawImage(glc,0,0)}requestAnimationFrame(loop)}
render();requestAnimationFrame(loop);
}catch(err){document.querySelector('.fallback').style.display='block';document.getElementById('hero').style.display='none';document.querySelector('.hint').style.display='none';console.error(err)}
</script></body></html>
